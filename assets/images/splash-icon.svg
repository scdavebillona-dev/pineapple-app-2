<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#FFFFFF"/>
  
  <!-- Circle background (muted) -->
  <circle cx="100" cy="100" r="70" fill="rgba(234, 88, 12, 0.15)"/>
  
  <!-- Circle border -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#EA580C" stroke-width="8"/>
  
  <!-- Left grass blade -->
  <g transform="translate(84, 100) rotate(-30)">
    <rect x="-4" y="0" width="8" height="24" fill="#EA580C" rx="4"/>
  </g>
  
  <!-- Center grass blade -->
  <rect x="96" y="85.6" width="8" height="24" fill="#EA580C" rx="4"/>
  
  <!-- Right grass blade -->
  <g transform="translate(116, 100) rotate(30)">
    <rect x="-4" y="0" width="8" height="24" fill="#EA580C" rx="4"/>
  </g>
</svg>